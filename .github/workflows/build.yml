name: Build DS Voice Recorder

on: [push]

jobs:
  build:
    runs-on: ubuntu-20.04
    container: devkitpro/devkitpro:latest  # ⬅️ Conteneur officiel préconfiguré

    steps:
      - uses: actions/checkout@v4

      - name: Install NDS tools
        run: dkp-pacman -S --noconfirm nds-dev

      - name: Build project
        run: |
          cd ds-voice-recorder
          make

      - name: Upload .nds
        uses: actions/upload-artifact@v4
        with:
          name: ds-voice-recorder
          path: ds-voice-recorder/*.nds
