name: Build DS Voice Recorder

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devkitPro
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://apt.devkitpro.org/install-devkitpro-deb.sh | sudo bash
          sudo dkp-pacman -S --noconfirm nds-dev

      - name: Build
        run: |
          cd ds-voice-recorder
          make

      - uses: actions/upload-artifact@v4
        with:
          name: ds-voice-recorder
          path: ds-voice-recorder/*.nds
