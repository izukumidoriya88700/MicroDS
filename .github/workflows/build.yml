name: Build DS Voice Recorder

on: [push]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup devkitPro
        run: |
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman
          sudo dkp-pacman -S --noconfirm nds-dev

      - name: Build
        run: |
          cd ds-voice-recorder
          make

      - uses: actions/upload-artifact@v4
        with:
          name: ds-voice-recorder
          path: ds-voice-recorder/*.nds
